<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>斗地主 · 卡牌大师</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand">🃏 斗地主</div>
    <div id="stats"></div>
  </header>

  <section id="ai-area">
    <div class="ai-card" id="ai-right">
      <div class="ai-name" id="ai-right-name">YUI_右</div>
      <div class="ai-role" id="ai-right-role"></div>
      <div class="ai-cards"><span class="card-back" id="ai-right-count"></span></div>
      <div class="ai-last" id="ai-right-last"></div>
    </div>
    <div class="table-center">
      <div id="bottom-cards"></div>
      <div id="last-play-box">
        <div id="last-player"></div>
        <div id="last-play"></div>
      </div>
      <div id="turn-hint"></div>
    </div>
    <div class="ai-card" id="ai-left">
      <div class="ai-name" id="ai-left-name">YUI_左</div>
      <div class="ai-role" id="ai-left-role"></div>
      <div class="ai-cards"><span class="card-back" id="ai-left-count"></span></div>
      <div class="ai-last" id="ai-left-last"></div>
    </div>
  </section>

  <section id="player-area">
    <div id="player-info">
      <span id="player-name">你</span>
      <span id="player-role"></span>
      <span id="player-must-hint"></span>
    </div>
    <div id="player-hand"></div>
    <div id="controls">
      <button id="btn-play" class="btn primary" disabled>出牌</button>
      <button id="btn-pass" class="btn" disabled>不要</button>
      <button id="btn-new" class="btn ghost">再来一局</button>
    </div>
  </section>

  <div id="msg-toast" class="toast"></div>
</div>
<script src="script.js"></script>
</body>
</html>
